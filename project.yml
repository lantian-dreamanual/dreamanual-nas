name: DreamanualNAS
options:
  bundleIdPrefix: com.dreamanual
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.dreamanual.nas
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DreamanualNAS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DreamanualNAS
    settings:
      base:
        INFOPLIST_FILE: DreamanualNAS/Info.plist
        PRODUCT_NAME: "Dreamanual NAS 助手"
        ENABLE_PREVIEWS: YES
